# Plateforme de la démo : Jenkins (CI/CD), Prometheus (métriques), Grafana (tableaux de bord).
# Lancement : docker compose up -d --build   (depuis le dossier infra/)
name: m354-devops

services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_casc/casc.yaml:ro
    networks: [devops-demo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [devops-demo]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/m354.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [devops-demo]
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  devops-demo:
    name: devops-demo
